[package]
name = "photocraft-ml"
description = "Pure-Rust ONNX inference engine, wgpu/rayon compute backends, SHA-256 model store and Tier 1 vision pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-algo = { workspace = true }
bytemuck = { workspace = true }
half = "2"
log = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
ureq = "3"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"], optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
